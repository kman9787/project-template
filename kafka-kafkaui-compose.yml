version: '3.6'

networks:
  default: 
     name: default-local-network
     driver: bridge
     
services:
  kafka:
    image: 'bitnami/kafka:latest'
    container_name: kafka
    networks:
      - default
    ports:
    - 9092:9092
    - 9093:9093
    volumes:
    -  ./data/kafka:/bitnami/kafka
    hostname: localhost.kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    networks:
      - default
    ports:
      - 9080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      SPRING_CONFIG_ADDITIONAL_LOCATION: '/app/config.yaml'
    volumes:
      - ./config/kafka-ui/config.yml:/app/config.yaml
      - ./config/kafka-ui/:/app/config  
     
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: schema-registry
    hostname: localhost.schema.registry
    depends_on:
      - kafka
    expose:
      - "9081"
    ports:
      - 9081:8081
    networks:
      - default
    environment:
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=localhost.kafka:9092
      - SCHEMA_REGISTRY_HOST_NAME=localhost.schema.registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
